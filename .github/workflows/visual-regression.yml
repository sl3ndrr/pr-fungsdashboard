name: Visual regression
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm test
      - name: Prepare reference app from the PR base
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          mkdir -p "$RUNNER_TEMP/dashboard-base"
          git archive "$BASE_SHA" | tar -x -C "$RUNNER_TEMP/dashboard-base"
      - name: Capture PR base screenshots with the current test harness
        if: github.event_name == 'pull_request'
        env:
          DASHBOARD_ROOT: ${{ runner.temp }}/dashboard-base
        run: npm run test:visual:update
      - name: Compare PR head against base
        if: github.event_name == 'pull_request'
        run: npm run test:visual
      - name: Capture a manual review set
        if: github.event_name == 'workflow_dispatch'
        run: npm run test:visual:update
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visual-report-and-screenshots
          path: |
            playwright-report/
            test-results/
            tests/visual/__snapshots__/
          retention-days: 14
