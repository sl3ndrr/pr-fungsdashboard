<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta
      name="description"
      content="Persönliches Dashboard für Prüfungen, Abgaben und wichtige Termine."
    >
    <meta name="theme-color" content="#f7f9ff" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#10141b" media="(prefers-color-scheme: dark)">
    <script>
      // Apply the saved preference before loading CSS; storage can be unavailable.
      try {
        const theme = localStorage.getItem('theme_pref');
        if (theme === 'light' || theme === 'dark') document.documentElement.dataset.theme = theme;
      } catch {}
    </script>
    <title>Semester-Roadmap</title>
    <link
      rel="icon"
      href="data:image/svg+xml,&lt;svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22&gt;&lt;text y=%22.9em%22 font-size=%2290%22&gt;%F0%9F%8E%93&lt;/text&gt;&lt;/svg&gt;"
    >
    <link rel="stylesheet" href="css/styles.css">
    <script type="module" src="js/app.js"></script>
  </head>
  <body>
    <noscript><p role="alert">Dieses Dashboard benötigt JavaScript. Bitte aktivieren Sie JavaScript und laden Sie die Seite erneut.</p></noscript>
    <div id="startup-error" role="alert" hidden>Das Dashboard konnte nicht geladen werden. Bitte laden Sie die Seite erneut.</div>
    <script>
      setTimeout(() => {
        if (document.documentElement.dataset.ready !== 'true') document.getElementById('startup-error').hidden = false;
      }, 5000);
    </script>
    <main class="container">
      <div id="simulation-notice" class="simulation-notice" role="status" hidden><span></span><button type="button">Beenden</button></div>
      <header class="page-header">
        <div class="page-brand">
          <h1 class="display">Semester-Roadmap</h1>
          <p id="semester-label" class="header-semester"></p>
          <p id="today-date" class="header-date"></p>
        </div>
        <div class="header-actions">
        <div class="theme-control">
          <div
            id="theme-switch"
            class="theme-switch segmented-filter"
            data-value="system"
            role="radiogroup"
            aria-label="Farbschema auswählen"
          >

            <button
              class="theme-option"
              type="button"
              data-theme-value="light"
              role="radio"
              aria-checked="false"
              tabindex="-1"
              aria-label="Helles Design"
              title="Helles Design"
            >
              <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="4"></circle>
                <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"></path>
              </svg>
            </button>

            <button
              class="theme-option"
              type="button"
              data-theme-value="system"
              role="radio"
              aria-checked="true"
              tabindex="0"
              aria-label="Systemeinstellung verwenden"
              title="Systemeinstellung verwenden"
            >
              <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="2" y="4" width="20" height="13" rx="2"></rect>
                <path d="M8 21h8M12 17v4"></path>
              </svg>
            </button>

            <button
              class="theme-option"
              type="button"
              data-theme-value="dark"
              role="radio"
              aria-checked="false"
              tabindex="-1"
              aria-label="Dunkles Design"
              title="Dunkles Design"
            >
              <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
              </svg>
            </button>
          </div>

          <p id="theme-switch-status" class="theme-switch-status visually-hidden" aria-live="polite">
            Folgt der Systemeinstellung
          </p>
        </div>
        </div>
      </header>

      <section class="top-grid" aria-label="Semesterübersicht">
        <section id="hero" class="hero" aria-live="polite"></section>

        <div class="overview-side">
        <section class="timeline-card" aria-labelledby="timeline-heading">
          <div class="timeline-title">
            <h2 id="timeline-heading" class="display">Semester<wbr>verlauf</h2>
            <div id="timeline-window" class="segmented-filter" role="group" aria-label="Zeitfenster">
              <button id="timeline-window-upcoming" type="button" data-window="upcoming" aria-pressed="true" aria-controls="timeline-container">Ab heute</button>
              <button id="timeline-window-semester" type="button" data-window="semester" aria-pressed="false" aria-controls="timeline-container">Semester</button>
            </div>
          </div>
          <div id="timeline-container" role="region" aria-label="Semesterverlauf, lineare Tagesskala"></div>
          <div id="timeline-legend-items" class="timeline-legend" aria-label="Zeichenerklärung"></div>
        </section>

      <section class="stats-container" aria-label="Termin-Statistiken">
        <div class="stats-grid" id="stats-line"></div>
      </section>
        </div>
      </section>


      <section class="appointments" aria-labelledby="appointments-heading">
        <div class="list-heading">
          <h2 id="appointments-heading" class="section-title display">Termine</h2>
          <div class="list-controls">
            <div id="type-filter" class="segmented-filter" role="group" aria-label="Termine nach Typ filtern">
              <button type="button" data-filter="all" aria-pressed="true" aria-controls="list">Alle</button>
              <button type="button" data-filter="Prüfung" aria-pressed="false" aria-controls="list">Prüfungen</button>
              <button type="button" data-filter="Abgabe" aria-pressed="false" aria-controls="list">Abgaben</button>
              <button type="button" data-filter="Termin" aria-pressed="false" aria-controls="list">Termine</button>
            </div>
            <div class="segmented-filter past-filter" role="group" aria-label="Vergangene Termine">
              <button id="toggle-past-btn" type="button" aria-pressed="false" aria-controls="list">Vergangene anzeigen</button>
            </div>
          </div>
        </div>
        <div class="dashboard-list" id="list" role="list" aria-labelledby="appointments-heading"></div>
      </section>
    </main>

    <div id="timeline-tooltip" class="timeline-tooltip" role="tooltip" data-open="false" aria-hidden="true"></div>
  </body>
</html>
