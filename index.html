<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta
      name="description"
      content="Persönliches Dashboard für Prüfungen, Abgaben und wichtige Termine."
    >
    <title>Semester-Roadmap</title>
    <link
      rel="icon"
      href="data:image/svg+xml,&lt;svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22&gt;&lt;text y=%22.9em%22 font-size=%2290%22&gt;%F0%9F%8E%93&lt;/text&gt;&lt;/svg&gt;"
    >
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800&amp;family=Inter:wght@400;500;600&amp;display=swap"
      rel="stylesheet"
    >
    <link rel="stylesheet" href="css/styles.css">
    <script type="module" src="js/app.js"></script>
  </head>
  <body>
    <main class="container">
      <header class="page-header">
        <label class="visually-hidden" for="theme-select">Farbschema auswählen</label>
        <select id="theme-select" class="theme-select">
          <option value="system">💻 System-Design</option>
          <option value="dark">🌙 Dark Mode</option>
          <option value="light">☀️ Light Mode</option>
        </select>
      </header>

      <section class="top-grid" aria-label="Semesterübersicht">
        <section id="hero" class="hero" aria-live="polite"></section>

        <section class="timeline-card" aria-labelledby="timeline-heading">
          <div class="timeline-title">
            <h1 id="timeline-heading" class="display">Semesterverlauf</h1>
            <button class="pill" id="cal-toggle-btn" type="button">📅 Kalender</button>
          </div>
          <div class="timeline-scroll">
            <div id="timeline-container"></div>
          </div>
          <p class="scroll-hint"><span aria-hidden="true">↔</span> Wischen für mehr</p>
        </section>
      </section>

      <section id="calendar-section" class="calendar-section" aria-labelledby="calendar-heading" hidden>
        <h2 id="calendar-heading" class="visually-hidden">Kalender</h2>
        <div class="calendar-card">
          <div class="cal-header">
            <button class="cal-nav-btn" id="cal-prev" type="button" aria-label="Vorheriger Monat">‹</button>
            <h2 class="cal-month-label" id="cal-month-label"></h2>
            <div class="cal-period-indicators" id="cal-period-indicators"></div>
            <button class="cal-nav-btn" id="cal-next" type="button" aria-label="Nächster Monat">›</button>
          </div>
          <div class="cal-scroll">
            <div class="cal-grid" id="cal-grid" role="grid" aria-labelledby="cal-month-label"></div>
          </div>
          <div class="cal-legend" id="cal-legend" aria-label="Legende">
            <div class="cal-legend-item"><span class="cal-legend-dot pruefung"></span>Prüfung</div>
            <div class="cal-legend-item"><span class="cal-legend-dot abgabe"></span>Abgabe</div>
            <div class="cal-legend-item"><span class="cal-legend-dot termin"></span>Termin</div>
          </div>
        </div>
      </section>

      <section class="stats-container" aria-label="Termin-Statistiken">
        <p class="stats-line" id="stats-line"></p>
        <button class="pill" id="toggle-past-btn" type="button">Vergangene anzeigen</button>
      </section>

      <section aria-labelledby="appointments-heading">
        <h2 id="appointments-heading" class="visually-hidden">Termine</h2>
        <div class="dashboard-list" id="list" role="list"></div>
      </section>
    </main>

    <aside id="cal-popover" class="cal-popover" role="dialog" aria-modal="false" aria-label="Termindetails"></aside>
  </body>
</html>
