<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Semester-Roadmap</title>
<script>
/* Theme so früh wie möglich setzen, um ein Aufblitzen des falschen Themes zu verhindern. */
(function () {
  try {
    var t = localStorage.getItem('theme_pref') || 'system';
    if (t !== 'system') document.documentElement.setAttribute('data-theme', t);
  } catch (e) {}
})();
</script>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>%F0%9F%8E%93</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<style>
/* =============================================================
   DESIGN TOKENS — "Liquid Glass" Designsystem
   ============================================================= */
:root {
  color-scheme: light dark;

  /* ---- Farben (Light) ---- */
  --bg: #eef1f7;
  --bg-rgb: 238, 241, 247;
  --ink: #0f1420;
  --ink-muted: #5c6577;
  --ink-faint: #8a93a6;

  --pruefung: #d61f16;
  --pruefung-rgb: 214, 31, 22;
  --abgabe: #0067d6;
  --abgabe-rgb: 0, 103, 214;
  --termin: #178040;
  --termin-rgb: 23, 128, 64;
  --amber: #a85700;
  --amber-rgb: 168, 87, 0;
  --urgent: #d61f16;
  --urgent-rgb: 214, 31, 22;
  --done: #178040;
  --done-rgb: 23, 128, 64;

  /* ---- Glas-Material (Light) ---- */
  --glass-bg: rgba(255, 255, 255, 0.55);
  --glass-bg-strong: rgba(255, 255, 255, 0.72);
  --glass-border: rgba(255, 255, 255, 0.65);
  --glass-edge: rgba(15, 20, 32, 0.06);
  --glass-highlight: rgba(255, 255, 255, 0.85);
  --glass-sheen: rgba(255, 255, 255, 0.55);
  --glass-blur: 24px;
  --glass-saturate: 180%;
  --glass-fallback-bg: rgba(255, 255, 255, 0.92);

  --shadow-sm: 0 1px 2px rgba(15, 20, 32, 0.06), 0 1px 1px rgba(15, 20, 32, 0.04);
  --shadow-md: 0 8px 24px -8px rgba(15, 20, 32, 0.16), 0 2px 8px -2px rgba(15, 20, 32, 0.08);
  --shadow-lg: 0 20px 44px -12px rgba(15, 20, 32, 0.22), 0 6px 16px -4px rgba(15, 20, 32, 0.1);
  --shadow-float: 0 10px 30px -8px rgba(15, 20, 32, 0.18);

  /* ---- Radien ---- */
  --r-xs: 8px;
  --r-sm: 12px;
  --r-md: 16px;
  --r-lg: 22px;
  --r-xl: 28px;
  --r-pill: 999px;

  /* ---- Bewegung ---- */
  --ease-standard: cubic-bezier(0.4, 0, 0.2, 1);
  --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
  --ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1);
  --ease-spring-soft: cubic-bezier(0.22, 1.12, 0.36, 1);
  --dur-fast: 150ms;
  --dur-med: 320ms;
  --dur-slow: 560ms;

  /* ---- Ebenen ---- */
  --z-bg: 0;
  --z-content: 1;
  --z-float: 20;
  --z-overlay: 100;

  --safe-t: env(safe-area-inset-top, 0px);
  --safe-b: env(safe-area-inset-bottom, 0px);
  --safe-l: env(safe-area-inset-left, 0px);
  --safe-r: env(safe-area-inset-right, 0px);
}

[data-theme="dark"] {
  --bg: #030407;
  --bg-rgb: 3, 4, 7;
  --ink: #f3f5fb;
  --ink-muted: #9aa3ba;
  --ink-faint: #626c85;

  --pruefung: #ff6961;
  --pruefung-rgb: 255, 105, 97;
  --abgabe: #409cff;
  --abgabe-rgb: 64, 156, 255;
  --termin: #3ecb7e;
  --termin-rgb: 62, 203, 126;
  --amber: #ffa733;
  --amber-rgb: 255, 167, 51;
  --urgent: #ff6961;
  --urgent-rgb: 255, 105, 97;
  --done: #3ecb7e;
  --done-rgb: 62, 203, 126;

  --glass-bg: rgba(28, 32, 44, 0.5);
  --glass-bg-strong: rgba(34, 38, 52, 0.68);
  --glass-border: rgba(255, 255, 255, 0.1);
  --glass-edge: rgba(0, 0, 0, 0.5);
  --glass-highlight: rgba(255, 255, 255, 0.09);
  --glass-sheen: rgba(255, 255, 255, 0.08);
  --glass-fallback-bg: rgba(20, 22, 30, 0.94);

  --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.5);
  --shadow-md: 0 8px 24px -8px rgba(0, 0, 0, 0.65), 0 2px 8px -2px rgba(0, 0, 0, 0.5);
  --shadow-lg: 0 20px 44px -12px rgba(0, 0, 0, 0.7), 0 6px 20px -4px rgba(0, 0, 0, 0.55);
  --shadow-float: 0 10px 30px -8px rgba(0, 0, 0, 0.6);
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #030407;
    --bg-rgb: 3, 4, 7;
    --ink: #f3f5fb;
    --ink-muted: #9aa3ba;
    --ink-faint: #626c85;

    --pruefung: #ff6961;
    --pruefung-rgb: 255, 105, 97;
    --abgabe: #409cff;
    --abgabe-rgb: 64, 156, 255;
    --termin: #3ecb7e;
    --termin-rgb: 62, 203, 126;
    --amber: #ffa733;
    --amber-rgb: 255, 167, 51;
    --urgent: #ff6961;
    --urgent-rgb: 255, 105, 97;
    --done: #3ecb7e;
    --done-rgb: 62, 203, 126;

    --glass-bg: rgba(28, 32, 44, 0.5);
    --glass-bg-strong: rgba(34, 38, 52, 0.68);
    --glass-border: rgba(255, 255, 255, 0.1);
    --glass-edge: rgba(0, 0, 0, 0.5);
    --glass-highlight: rgba(255, 255, 255, 0.09);
    --glass-sheen: rgba(255, 255, 255, 0.08);
    --glass-fallback-bg: rgba(20, 22, 30, 0.94);

    --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.5);
    --shadow-md: 0 8px 24px -8px rgba(0, 0, 0, 0.65), 0 2px 8px -2px rgba(0, 0, 0, 0.5);
    --shadow-lg: 0 20px 44px -12px rgba(0, 0, 0, 0.7), 0 6px 20px -4px rgba(0, 0, 0, 0.55);
    --shadow-float: 0 10px 30px -8px rgba(0, 0, 0, 0.6);
  }
}

[data-theme="light"] { color-scheme: light; }
[data-theme="dark"]  { color-scheme: dark; }

/* =============================================================
   RESET & BASE
   ============================================================= */
* { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }

body {
  background: var(--bg);
  color: var(--ink);
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
  min-height: 100dvh;
  line-height: 1.5;
  -webkit-tap-highlight-color: transparent;
  transition: background-color var(--dur-slow) var(--ease-standard), color var(--dur-slow) var(--ease-standard);
  overflow-x: hidden;
}

.display { font-family: 'Outfit', -apple-system, BlinkMacSystemFont, system-ui, sans-serif; }

a, button, input { font-family: inherit; color: inherit; }

::selection { background: rgba(var(--abgabe-rgb), 0.28); }

/* =============================================================
   ATMOSPHÄRISCHER HINTERGRUND
   ============================================================= */
.bg-atmosphere {
  position: fixed;
  inset: 0;
  z-index: var(--z-bg);
  overflow: hidden;
  pointer-events: none;
}
.bg-atmosphere .blob {
  position: absolute;
  width: 52vmax;
  height: 52vmax;
  border-radius: 50%;
  filter: blur(64px);
  opacity: 0.5;
  will-change: transform;
}
[data-theme="dark"] .bg-atmosphere .blob,
:root:not([data-theme="light"]) .bg-atmosphere .blob { opacity: 0.28; }
@media (prefers-color-scheme: light) { :root:not([data-theme="dark"]) .bg-atmosphere .blob { opacity: 0.5; } }

.bg-atmosphere .blob-1 {
  top: -18vmax; left: -14vmax;
  background: radial-gradient(circle at 35% 35%, rgba(var(--abgabe-rgb), 0.55), transparent 70%);
  animation: driftA 34s ease-in-out infinite alternate;
}
.bg-atmosphere .blob-2 {
  bottom: -20vmax; right: -16vmax;
  background: radial-gradient(circle at 60% 40%, rgba(168, 85, 247, 0.45), transparent 70%);
  animation: driftB 40s ease-in-out infinite alternate;
}
.bg-atmosphere .blob-3 {
  bottom: 8vmax; left: 20vmax;
  background: radial-gradient(circle at 50% 50%, rgba(var(--termin-rgb), 0.35), transparent 70%);
  animation: driftC 46s ease-in-out infinite alternate;
}
@keyframes driftA { from { transform: translate(0, 0) scale(1); } to { transform: translate(6vmax, 8vmax) scale(1.12); } }
@keyframes driftB { from { transform: translate(0, 0) scale(1); } to { transform: translate(-7vmax, -6vmax) scale(1.08); } }
@keyframes driftC { from { transform: translate(0, 0) scale(1); } to { transform: translate(4vmax, -7vmax) scale(1.15); } }

.container {
  max-width: 1480px;
  margin: 0 auto;
  position: relative;
  z-index: var(--z-content);
  padding: 0.75rem clamp(0.75rem, 4vw, 2.5rem) calc(3.5rem + var(--safe-b));
}

/* =============================================================
   GLAS-MATERIAL (wiederverwendbar)
   ============================================================= */
.glass {
  position: relative;
  background:
    linear-gradient(135deg, var(--glass-sheen) 0%, transparent 42%),
    linear-gradient(to bottom, var(--glass-highlight) 0%, transparent 16%),
    var(--glass-bg);
  border: 1px solid var(--glass-border);
  border-radius: var(--r-lg);
  box-shadow: var(--shadow-md), inset 0 1px 0 var(--glass-highlight);
  backdrop-filter: blur(var(--glass-blur)) saturate(var(--glass-saturate));
  -webkit-backdrop-filter: blur(var(--glass-blur)) saturate(var(--glass-saturate));
  transition: background-color var(--dur-slow) var(--ease-standard),
              border-color var(--dur-slow) var(--ease-standard),
              box-shadow var(--dur-med) var(--ease-standard),
              transform var(--dur-med) var(--ease-spring-soft);
}
@supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {
  .glass { background: var(--glass-fallback-bg); }
}
/* Reaktiver Lichtreflex – nur auf Geräten mit Maus/Trackpad */
@media (hover: hover) and (pointer: fine) {
  .glass-sheen::after {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: inherit;
    pointer-events: none;
    background: radial-gradient(320px circle at var(--px, 50%) var(--py, 0%), var(--glass-sheen) 0%, transparent 62%);
    opacity: 0;
    transition: opacity var(--dur-med) var(--ease-standard);
  }
  .glass-sheen:hover::after, .glass-sheen:focus-within::after { opacity: 1; }
}

/* =============================================================
   TOPBAR (schwebende Werkzeugleiste)
   ============================================================= */
.topbar-spacer { height: calc(0.75rem + var(--safe-t)); }
.topbar {
  position: sticky;
  top: calc(0.6rem + var(--safe-t));
  z-index: var(--z-float);
  max-width: 1480px;
  margin: 0 auto;
  padding: 0 clamp(0.75rem, 4vw, 2.5rem);
  pointer-events: none;
}
.topbar-inner {
  pointer-events: auto;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 0.75rem;
  padding: 0.7rem 0.75rem 0.7rem 1.1rem;
  border-radius: var(--r-pill);
  transition: padding var(--dur-med) var(--ease-out), box-shadow var(--dur-med) var(--ease-out);
}
.topbar.is-compact .topbar-inner { padding: 0.4rem 0.5rem 0.4rem 0.9rem; box-shadow: var(--shadow-float), inset 0 1px 0 var(--glass-highlight); }

.topbar-title {
  display: flex;
  align-items: center;
  gap: 0.5rem;
  font-family: 'Outfit', sans-serif;
  font-weight: 700;
  font-size: 1rem;
  letter-spacing: -0.01em;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  min-width: 0;
  transition: font-size var(--dur-med) var(--ease-out), gap var(--dur-med) var(--ease-out);
}
.topbar-title .emoji { font-size: 1.15rem; flex-shrink: 0; transition: font-size var(--dur-med) var(--ease-out); }
.topbar-title .label { overflow: hidden; text-overflow: ellipsis; }
.topbar.is-compact .topbar-title { font-size: 0.88rem; }
.topbar.is-compact .topbar-title .emoji { font-size: 1rem; }
@media (max-width: 420px) {
  .topbar-title .label { display: none; }
  .topbar-inner { padding-left: 0.85rem; }
}

/* Theme-Segmented-Control */
.theme-switch {
  position: relative;
  display: inline-grid;
  grid-auto-flow: column;
  grid-auto-columns: 1fr;
  background: rgba(var(--bg-rgb), 0.4);
  border: 1px solid var(--glass-edge);
  border-radius: var(--r-pill);
  padding: 3px;
  flex-shrink: 0;
}
.theme-switch-thumb {
  position: absolute;
  top: 3px; left: 3px; bottom: 3px;
  width: calc((100% - 6px) / 3);
  border-radius: var(--r-pill);
  background: var(--card, var(--glass-bg-strong));
  background: var(--ink);
  opacity: 0.92;
  box-shadow: var(--shadow-sm);
  transition: transform var(--dur-med) var(--ease-spring);
  z-index: 0;
}
.theme-switch-btn {
  position: relative;
  z-index: 1;
  appearance: none;
  border: none;
  background: transparent;
  display: flex;
  align-items: center;
  justify-content: center;
  width: 40px;
  height: 34px;
  min-width: 44px;
  border-radius: var(--r-pill);
  cursor: pointer;
  font-size: 0.95rem;
  color: var(--ink-muted);
  transition: color var(--dur-fast) var(--ease-standard), transform var(--dur-fast) var(--ease-spring);
}
.theme-switch-btn[aria-pressed="true"] { color: var(--bg); }
.theme-switch-btn:active { transform: scale(0.88); }
.theme-switch-label { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* =============================================================
   TYPOGRAFIE / LAYOUT-GRUNDGERÜST
   ============================================================= */
.top-grid { display: grid; grid-template-columns: 1fr; gap: 1rem; margin-bottom: 1.5rem; }
@media (min-width: 880px) { .top-grid { grid-template-columns: 0.85fr 1.15fr; align-items: stretch; } }

/* ---- Hero ---- */
.hero {
  padding: 1.5rem;
  display: flex; align-items: center; gap: 1.2rem;
  animation: floatIn var(--dur-slow) var(--ease-out) both;
}
.hero.urgent { border-color: rgba(var(--urgent-rgb), 0.35); }
.hero.urgent::before { background: linear-gradient(135deg, rgba(var(--urgent-rgb), 0.16) 0%, transparent 55%), linear-gradient(to bottom, var(--glass-highlight) 0%, transparent 16%), var(--glass-bg); }
.hero.urgent { animation: floatIn var(--dur-slow) var(--ease-out) both, pulseRing 2.6s ease-in-out 0.7s infinite; }

.hero-icon { width: 52px; height: 52px; flex-shrink: 0; border-radius: var(--r-md); display: flex; align-items: center; justify-content: center; font-size: 1.6rem; box-shadow: inset 0 1px 0 rgba(255,255,255,0.4), var(--shadow-sm); }
.hero-icon.pruefung { background: rgba(var(--pruefung-rgb), 0.14); }
.hero-icon.abgabe   { background: rgba(var(--abgabe-rgb), 0.14); }
.hero-icon.termin   { background: rgba(var(--termin-rgb), 0.14); }
.hero-text { min-width: 0; flex: 1; }
.hero-label { font-size: 0.72rem; color: var(--ink-faint); margin-bottom: 0.2rem; text-transform: uppercase; letter-spacing: 0.07em; font-weight: 700; }
.hero-title { font-family: 'Outfit', sans-serif; font-size: clamp(1.1rem, 2vw, 1.3rem); font-weight: 700; line-height: 1.3; letter-spacing: -0.01em; }
.hero-meta { font-size: 0.85rem; color: var(--ink-muted); margin-top: 0.25rem; }
.hero-days { text-align: right; flex-shrink: 0; font-family: 'Outfit', sans-serif; font-weight: 700; font-size: 1.15rem; color: var(--amber); }
.hero.urgent .hero-days { color: var(--urgent); }
.hero-empty { text-align: center; width: 100%; color: var(--done); font-size: 1rem; font-weight: 600; padding: 0.5rem 0; }

@media (max-width: 480px) {
  .hero { flex-direction: column; align-items: flex-start; gap: 0.85rem; padding: 1.25rem; }
  .hero-icon { width: 44px; height: 44px; font-size: 1.35rem; border-radius: var(--r-sm); }
  .hero-title { font-size: 1rem; }
  .hero-days { text-align: left; margin-left: 0; background: rgba(var(--amber-rgb), 0.12); padding: 0.25rem 0.7rem; border-radius: var(--r-xs); font-size: 0.95rem; }
  .hero.urgent .hero-days { background: rgba(var(--urgent-rgb), 0.12); }
}

/* ---- Zeitstrahl-Karte ---- */
.timeline-card {
  padding: 1.25rem;
  display: flex; flex-direction: column; justify-content: center;
  animation: floatIn var(--dur-slow) var(--ease-out) both;
  animation-delay: 60ms;
  position: relative; min-width: 0;
}
@media (max-width: 480px) { .timeline-card { padding: 1rem 1rem 0.8rem; } .timeline-title { font-size: 0.8rem; } }
.timeline-title { font-size: 0.85rem; color: var(--ink-muted); font-weight: 600; display: flex; justify-content: space-between; align-items: center; }

.timeline-scroll { overflow-x: auto; padding-top: 2.2rem; padding-bottom: 1.5rem; scrollbar-width: none; -webkit-overflow-scrolling: touch; touch-action: pan-x; width: 100%; }
.timeline-scroll::-webkit-scrollbar { display: none; }

.scroll-hint { display: none; text-align: center; font-size: 0.7rem; color: var(--ink-faint); margin-top: -0.5rem; animation: breathe 2s infinite; pointer-events: none; }
@media (max-width: 880px) { .scroll-hint { display: block; } }

.timeline-track { position: relative; height: 6px; background: rgba(var(--bg-rgb), 0.6); border: 1px solid var(--glass-edge); border-radius: var(--r-pill); min-width: 600px; margin: 0.8rem 0.5rem; }
.timeline-progress { position: absolute; left: 0; top: 0; height: 100%; background: linear-gradient(90deg, var(--termin), var(--abgabe)); border-radius: var(--r-pill); transition: width 1.1s var(--ease-out); z-index: 1; box-shadow: 0 0 10px rgba(var(--abgabe-rgb), 0.4); }

.timeline-period-span { position: absolute; top: 50%; transform: translateY(-50%); height: 20px; border-top: 1.5px dashed; border-bottom: 1.5px dashed; border-radius: var(--r-xs); z-index: 2; pointer-events: none; }
.timeline-period-label { position: absolute; top: -1.7rem; font-size: 0.65rem; white-space: nowrap; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; z-index: 4; }
.timeline-period-tick { position: absolute; top: 50%; transform: translate(-50%, -50%); width: 2px; height: 24px; border-radius: 1px; z-index: 3; }
.timeline-period-label[data-row="1"] { top: -3rem; }

.timeline-dot {
  position: absolute; top: 50%; width: 15px; height: 15px; border-radius: 50%;
  transform: translate(-50%, -50%); border: 3px solid var(--bg); cursor: pointer; z-index: 5;
  box-shadow: 0 2px 6px rgba(0,0,0,0.18); transition: transform var(--dur-fast) var(--ease-spring), box-shadow var(--dur-fast) var(--ease-standard);
}
.timeline-dot:hover, .timeline-dot:focus-visible { transform: translate(-50%, -50%) scale(1.3); }
.timeline-dot.enter { animation: popInDot var(--dur-med) var(--ease-spring) both; animation-delay: var(--delay, 0s); }
.timeline-dot.pruefung { background: var(--pruefung); box-shadow: 0 2px 8px rgba(var(--pruefung-rgb), 0.5); }
.timeline-dot.abgabe   { background: var(--abgabe); box-shadow: 0 2px 8px rgba(var(--abgabe-rgb), 0.5); }
.timeline-dot.termin   { background: var(--termin); box-shadow: 0 2px 8px rgba(var(--termin-rgb), 0.5); }

@keyframes dotPing {
  0%   { transform: translate(-50%, -50%) scale(1); }
  50%  { transform: translate(-50%, -50%) scale(1.7); }
  100% { transform: translate(-50%, -50%) scale(1); }
}
.timeline-dot.ping { animation: dotPing 0.4s var(--ease-spring); }

.timeline-today { position: absolute; top: 50%; width: 2px; height: 26px; background: var(--ink); transform: translate(-50%, -50%); z-index: 6; border-radius: 1px; }
.timeline-today-label { position: absolute; top: -1.6rem; transform: translateX(-50%); font-size: 0.7rem; font-weight: 700; color: var(--ink); white-space: nowrap; z-index: 6; }
.timeline-month { position: absolute; bottom: -1.5rem; transform: translateX(-50%); font-size: 0.7rem; color: var(--ink-faint); font-weight: 500; }

/* ---- Stats & Filter ---- */
.stats-container { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.2rem; flex-wrap: wrap; gap: 0.5rem; }
.stats-line { font-size: 0.88rem; color: var(--ink-muted); }
@media (max-width: 480px) { .stats-line { font-size: 0.82rem; } }

.pill {
  color: var(--ink-muted); font-family: 'Inter', sans-serif; font-size: 0.8rem; font-weight: 600;
  padding: 0.45rem 1rem; border-radius: var(--r-pill); cursor: pointer; flex-shrink: 0;
  min-height: 36px; display: inline-flex; align-items: center; gap: 0.3rem;
  transition: color var(--dur-fast) var(--ease-standard), transform var(--dur-fast) var(--ease-spring), background-color var(--dur-med) var(--ease-standard);
}
.pill:hover { color: var(--ink); }
.pill:active { transform: scale(0.94); }
.pill.active { background: var(--ink); color: var(--bg); border-color: transparent; }
.pill.active::before, .pill.active::after { display: none; }

/* =============================================================
   LISTE / KARTEN
   ============================================================= */
.dashboard-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 340px), 1fr)); gap: 0.85rem; }
@media (max-width: 480px) { .dashboard-list { gap: 0.65rem; } }

.card {
  container-type: inline-size; container-name: card;
  padding: 1.1rem;

    { id: 'wiesbaden-2', label: 'in Wiesbaden', start: '2026-10-15', end: '2026-10-25', rgb: '139, 92, 246' }
  ];

  const ICONS = { 'Prüfung': '📝', 'Abgabe': '📤', 'Termin': '📌' };
  const STORAGE_KEY = 'done_items_v1';

  let doneItems  = [];
  let calVisible = false;

  // Kalendergrenzen automatisch aus Terminen und Zeiträumen ableiten.
  const calendarDateValues = [
    ...events.map(e => e.date),
    ...PERIODS.flatMap(p => [p.start, p.end])
  ];
  const calMinIso = calendarDateValues.reduce((a, b) => a < b ? a : b);
  const calMaxIso = calendarDateValues.reduce((a, b) => a > b ? a : b);
  const [calMinYear, calMinMonth1] = calMinIso.split('-').map(Number);
  const [calMaxYear, calMaxMonth1] = calMaxIso.split('-').map(Number);
  const monthIndex = (year, month) => year * 12 + month;
  const CAL_MIN_MONTH_INDEX = monthIndex(calMinYear, calMinMonth1 - 1);
  const CAL_MAX_MONTH_INDEX = monthIndex(calMaxYear, calMaxMonth1 - 1);

  const _n = new Date();
  const initialCalMonthIndex = Math.min(
    CAL_MAX_MONTH_INDEX,
    Math.max(CAL_MIN_MONTH_INDEX, monthIndex(_n.getFullYear(), _n.getMonth()))
  );
  let calYear  = Math.floor(initialCalMonthIndex / 12);
  let calMonth = initialCalMonthIndex % 12;

  async function loadDoneItems() {
    try {
      if (window.storage && typeof window.storage.get === 'function') {
        const r = await window.storage.get(STORAGE_KEY, false);
        doneItems = r ? JSON.parse(r.value) : [];
      } else {
        const r = localStorage.getItem(STORAGE_KEY);
        doneItems = r ? JSON.parse(r) : [];
      }
    } catch (e) { doneItems = []; }

    // NEU: Hardcoded "Done" Status aus dem Code übernehmen
    events.forEach(e => {
      if (e.isDone && !doneItems.includes(e.id)) {
        doneItems.push(e.id);
      }
    });

    // Speichern, falls durch Code-Änderungen neue Items hinzugekommen sind
    await saveDoneItems();
  }

  async function saveDoneItems() {
    try {
      if (window.storage && typeof window.storage.set === 'function') {
        await window.storage.set(STORAGE_KEY, JSON.stringify(doneItems), false);
      } else {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(doneItems));
      }
    } catch (e) {}
  }

  function parseISOString(s) {
    const [y, m, d] = s.split('-').map(Number);
    return new Date(y, m - 1, d);
  }
  function midnight(d) { return new Date(d.getFullYear(), d.getMonth(), d.getDate()); }
  function calendarDayDiff(a, b) {
    const utcA = Date.UTC(a.getFullYear(), a.getMonth(), a.getDate());
    const utcB = Date.UTC(b.getFullYear(), b.getMonth(), b.getDate());
    return Math.round((utcA - utcB) / 86400000);
  }
  function typeClass(t) { return t === 'Prüfung' ? 'pruefung' : t === 'Abgabe' ? 'abgabe' : 'termin'; }
  function escapeHtml(s) {
    return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }
  function formatDate(d) {
    return d.toLocaleDateString('de-DE', { day: '2-digit', month: '2-digit', year: 'numeric' });
  }
  function periodsOnDay(dayMid) {
    return PERIODS.filter(p => {
      const s = midnight(parseISOString(p.start));
      const e = midnight(parseISOString(p.end));
      return dayMid >= s && dayMid <= e;
    });
  }

  window.toggleDone = function(id) {
    doneItems = doneItems.includes(id) ? doneItems.filter(x => x !== id) : [...doneItems, id];
    saveDoneItems();
    render(false);
  };

  /* ANGEPASST: Transiente Klick-Logik Zeitstrahl */
  window.selectTimelineEvent = function(e, id) {
    const dot = e.currentTarget;
    dot.classList.remove('ping');
    void dot.offsetWidth; // Reflow erzwingen
    dot.classList.add('ping');

    const card = document.getElementById(`card-${id}`);
    if (card) {
      card.scrollIntoView({ behavior: REDUCE_MOTION ? 'auto' : 'smooth', block: 'center' });
      card.classList.remove('pulse-highlight');
      void card.offsetWidth;
      card.classList.add('pulse-highlight');
    }
  };

  window.openCalMenu = function(e, id) {
    e.stopPropagation();
    const ev = events.find(x => x.id === id);
    if (!ev) return;

    const pop = document.getElementById('cal-popover');
    const isDone = ev.type === 'Abgabe' && doneItems.includes(ev.id);

    let actionBtn = '';
    if (ev.type === 'Abgabe') {
      actionBtn = `<button class="cal-popover-btn" onclick="toggleDone('${ev.id}'); closeCalMenu();">
        ${isDone ? 'Als offen markieren' : '✔ Als erledigt markieren'}
      </button>`;
    }

    pop.innerHTML = `
      <div class="cal-popover-head">
        <span class="badge ${typeClass(ev.type)}">${ev.type}</span>
        <button class="cal-popover-close" onclick="closeCalMenu()" aria-label="Schließen">✕</button>
      </div>
      <div class="cal-popover-title">${escapeHtml(ev.title)}</div>
      <div class="cal-popover-meta">📅 ${formatDate(parseISOString(ev.date))} · ⏰ ${escapeHtml(ev.time)}</div>
      ${actionBtn}
    `;

    pop.style.display = 'flex';

    const tRect = e.currentTarget.getBoundingClientRect();
    const pRect = pop.getBoundingClientRect();
    let top = tRect.bottom + 6;
    let left = tRect.left;

    if (left + pRect.width > window.innerWidth - 12) left = window.innerWidth - pRect.width - 12;
    if (top + pRect.height > window.innerHeight - 12) top = tRect.top - pRect.height - 6;

    pop.style.top  = `${Math.max(10, top)}px`;
    pop.style.left = `${Math.max(10, left)}px`;
  };

  window.closeCalMenu = function() {
    const p = document.getElementById('cal-popover');
    if (p) p.style.display = 'none';
  };

  document.addEventListener('click', (e) => {
    const pop = document.getElementById('cal-popover');
    if (pop && pop.style.display === 'flex' && !pop.contains(e.target) && !e.target.closest('.cal-event-tag')) {
      closeCalMenu();
    }
  });
  window.addEventListener('scroll', closeCalMenu, true);

  function buildTimeline(todayMid, animate) {
    const mainEvents = events.filter(e => !e.calOnly);
    const allTimes = mainEvents.map(e => midnight(parseISOString(e.date)).getTime());
    const periodTimes = PERIODS.flatMap(p => [
      midnight(parseISOString(p.start)).getTime(),
      midnight(parseISOString(p.end)).getTime()
    ]);
    const timelineTimes = [...allTimes, ...periodTimes];
    let minT = Math.min(todayMid.getTime(), ...timelineTimes);
    let maxT = Math.max(todayMid.getTime(), ...timelineTimes);
    const range = (maxT - minT) || 1;
    const pad   = range * 0.04;
    minT -= pad; maxT += pad;
    const span = maxT - minT;
    const posOf = t => ((t - minT) / span) * 100;

    const todayPct = posOf(todayMid.getTime());

    let periodsHtml = '';
    // for simple row-stacking of labels that would otherwise overlap;
    // seeded with "Heute" so period labels never collide with the today-marker label.
    const placedRanges = [{ l: todayPct - 6, r: todayPct + 6 }];
    PERIODS.forEach(p => {
      const pStartT = midnight(parseISOString(p.start)).getTime();
      const pEndT   = midnight(parseISOString(p.end)).getTime();
      if (pEndT <= minT || pStartT >= maxT) return;
      const pL = Math.max(0, posOf(pStartT));
      const pR = Math.min(100, posOf(pEndT));
      const pW = pR - pL;
      const midPct = (pL + pR) / 2;

      const row = placedRanges.some(r => midPct > r.l - 6 && midPct < r.r + 6) ? 1 : 0;
      placedRanges.push({ l: pL, r: pR });

      periodsHtml += `
        <div class="timeline-period-span" style="left:${pL}%;width:${pW}%;background:rgba(${p.rgb},0.1);border-color:rgba(${p.rgb},0.45)"></div>
        <div class="timeline-period-tick" style="left:${pL}%;background:rgba(${p.rgb},0.45)"></div>
        <div class="timeline-period-tick" style="left:${pR}%;background:rgba(${p.rgb},0.45)"></div>
        <div class="timeline-period-label" data-row="${row}" style="left:${midPct}%;transform:translateX(-50%);color:rgb(${p.rgb})">${escapeHtml(p.label)}</div>
      `;
    });

    let dots = '';
    mainEvents.forEach((e, i) => {
      const t   = midnight(parseISOString(e.date)).getTime();
      const pct = posOf(t);
      const enterCls = animate ? 'enter' : '';
      const delay    = animate ? `--delay:${(0.2 + i * 0.04).toFixed(3)}s;` : '';
      dots += `<div class="timeline-dot ${typeClass(e.type)} ${enterCls}"
                    style="left:${pct}%;${delay}"
                    onclick="selectTimelineEvent(event, '${e.id}')"
                    onkeydown="if(event.key === 'Enter' || event.key === ' '){ event.preventDefault(); selectTimelineEvent(event, '${e.id}'); }"
                    tabindex="0" role="button"
                    aria-label="${escapeHtml(e.type)}: ${escapeHtml(e.title)} am ${formatDate(parseISOString(e.date))}"
                    title="${escapeHtml(e.title)} – ${formatDate(parseISOString(e.date))}">
               </div>`;
    });

    dots += `<div class="timeline-today" style="left:${todayPct}%"></div>`;
    dots += `<div class="timeline-today-label" style="left:${todayPct}%">Heute</div>`;

    let months = '';
    let cursor = new Date(minT);
    cursor = new Date(cursor.getFullYear(), cursor.getMonth(), 1);
    if (cursor.getTime() < minT) cursor.setMonth(cursor.getMonth() + 1);
    let guard = 0;
    while (cursor.getTime() <= maxT && guard < 24) {
      const pct   = posOf(cursor.getTime());
      const label = cursor.toLocaleDateString('de-DE', { month: 'short', year: '2-digit' });
      months += `<div class="timeline-month" style="left:${pct}%">${label}</div>`;
      cursor.setMonth(cursor.getMonth() + 1);
      guard++;
    }

    const progressPct = Math.min(100, Math.max(0, todayPct));
    return {
      html: `<div class="timeline-track">
        <div class="timeline-progress" id="timeline-progress-bar" style="width:${animate ? 0 : progressPct}%"></div>
        ${periodsHtml}
        ${months}
        ${dots}
      </div>`,
      targetPct: progressPct
    };
  }

  function renderHero(item, todayMid) {
    const el = document.getElementById('hero');
    if (!item) {
      el.className = 'hero glass glass-sheen';
      el.innerHTML = `<div class="hero-empty">Keine offenen Termine mehr – geschafft! 🎉</div>`;
      return;
    }
    const d        = parseISOString(item.date);
    const diffDays = calendarDayDiff(d, todayMid);
    const urgent   = diffDays <= 7;
    el.className   = `hero glass glass-sheen ${urgent ? 'urgent' : ''}`;
    const daysLabel = diffDays === 0 ? 'Heute' : `in ${diffDays} Tag${diffDays !== 1 ? 'en' : ''}`;
    el.innerHTML = `
      <div class="hero-icon ${typeClass(item.type)}">${ICONS[item.type]}</div>
      <div class="hero-text">
        <div class="hero-label">Als Nächstes</div>
        <div class="hero-title">${escapeHtml(item.title)}</div>
        <div class="hero-meta">${formatDate(d)} · ${escapeHtml(item.time)}</div>
      </div>
      <div class="hero-days">${daysLabel}</div>
    `;
  }

  const MONTH_NAMES = ['Januar','Februar','März','April','Mai','Juni',
                       'Juli','August','September','Oktober','November','Dezember'];

  function toggleCalendar() {
    calVisible = !calVisible;
    document.getElementById('calendar-section').style.display = calVisible ? 'block' : 'none';
    document.getElementById('cal-toggle-btn').classList.toggle('active', calVisible);
    if (calVisible) renderCalendar();
  }

  function calNav(delta) {
    let nextMonth = calMonth + delta;
    let nextYear = calYear;
    if (nextMonth > 11) { nextMonth = 0; nextYear++; }
    if (nextMonth < 0)  { nextMonth = 11; nextYear--; }

    const nextMonthIndex = monthIndex(nextYear, nextMonth);
    if (nextMonthIndex < CAL_MIN_MONTH_INDEX || nextMonthIndex > CAL_MAX_MONTH_INDEX) return;

    calMonth = nextMonth;
    calYear = nextYear;
    renderCalendar();
  }

  function renderCalendar() {
    const today = midnight(new Date());

    document.getElementById('cal-month-label').textContent = `${MONTH_NAMES[calMonth]} ${calYear}`;

    const currentMonthIndex = monthIndex(calYear, calMonth);
    const isMinDate = currentMonthIndex <= CAL_MIN_MONTH_INDEX;
    const isMaxDate = currentMonthIndex >= CAL_MAX_MONTH_INDEX;

    const prevBtn = document.getElementById('cal-prev');
    prevBtn.style.opacity = isMinDate ? '0.2' : '1';
    prevBtn.style.pointerEvents = isMinDate ? 'none' : 'auto';
    prevBtn.setAttribute('aria-disabled', String(isMinDate));

    const nextBtn = document.getElementById('cal-next');
    nextBtn.style.opacity = isMaxDate ? '0.2' : '1';
    nextBtn.style.pointerEvents = isMaxDate ? 'none' : 'auto';
    nextBtn.setAttribute('aria-disabled', String(isMaxDate));

    const monthStart = new Date(calYear, calMonth, 1);
    const monthEnd   = new Date(calYear, calMonth + 1, 0);
    const overlappingPeriods = PERIODS.filter(p => {
      const s = midnight(parseISOString(p.start));
      const e = midnight(parseISOString(p.end));
      return monthEnd >= s && monthStart <= e;
    });
    document.getElementById('cal-period-indicators').innerHTML = overlappingPeriods.map(p => `
      <span class="cal-period-indicator" style="color:rgb(${p.rgb});background:rgba(${p.rgb},0.1);border-color:rgba(${p.rgb},0.35)">
        <span class="cal-period-dot-sm" style="background:rgb(${p.rgb})"></span>${escapeHtml(p.label)}
      </span>`).join('');

    const byDate = {};
    events.forEach(e => {
      byDate[e.date] = byDate[e.date] || [];
      byDate[e.date].push(e);
    });

    const first = new Date(calYear, calMonth, 1);
    let start = new Date(first);
    let dow = start.getDay();
    if (dow === 0) dow = 7;
    start.setDate(start.getDate() - (dow - 1));

    let html = '';
    ['Mo','Di','Mi','Do','Fr','Sa','So'].forEach(d => {
      html += `<div class="cal-day-header">${d}</div>`;
    });

    let cur = new Date(start);
    for (let i = 0; i < 42; i++) {
      const curMid = midnight(cur);
      const iso    = `${cur.getFullYear()}-${String(cur.getMonth()+1).padStart(2,'0')}-${String(cur.getDate()).padStart(2,'0')}`;
      const inMonth = cur.getMonth() === calMonth;
      const isToday = curMid.getTime() === today.getTime();

      const dayPeriods = periodsOnDay(curMid);
      const activePeriod = dayPeriods[0]; // first matching period wins visually if they ever overlap

      let cls = 'cal-day';
      if (!inMonth) cls += ' other-month';
      if (isToday)  cls += ' today';
      if (activePeriod) cls += ' period';

      let dayStyle = '';
      if (activePeriod) {
        const pStart = midnight(parseISOString(activePeriod.start));
        const pEnd   = midnight(parseISOString(activePeriod.end));
        let borderSide = '';
        if (curMid.getTime() === pStart.getTime()) borderSide = `border-left:3px solid rgb(${activePeriod.rgb});`;
        if (curMid.getTime() === pEnd.getTime())   borderSide += `border-right:3px solid rgb(${activePeriod.rgb});`;
        dayStyle = ` style="background:rgba(${activePeriod.rgb},0.12);border-color:rgba(${activePeriod.rgb},0.35);${borderSide}"`;
      }

      const dayEvts = byDate[iso] || [];

      const numHtml = isToday
        ? `<div class="cal-day-num"><span class="cal-day-num-inner">${cur.getDate()}</span></div>`
        : `<div class="cal-day-num">${cur.getDate()}</div>`;

      const tagsHtml = dayEvts.map(e => {
        return `<span class="cal-event-tag ${typeClass(e.type)}" onclick="openCalMenu(event, '${e.id}')" title="${escapeHtml(e.title)} (${escapeHtml(e.time)})">${escapeHtml(e.title)}<span class="cal-event-time">${escapeHtml(e.time)}</span></span>`;
      }).join('');

      html += `<div class="${cls}"${dayStyle}>${numHtml}${tagsHtml}</div>`;
      cur.setDate(cur.getDate() + 1);
    }

    document.getElementById('cal-grid').innerHTML = html;
  }

  function buildLegendPeriods() {
    const legend = document.getElementById('cal-legend');
    PERIODS.forEach(p => {
      const item = document.createElement('div');
      item.className = 'cal-legend-item';
      item.innerHTML = `<span class="cal-legend-period-swatch" style="background:rgba(${p.rgb},0.15);border-color:rgba(${p.rgb},0.5)"></span>${escapeHtml(p.label)}-Zeitraum (${formatDate(parseISOString(p.start))} – ${formatDate(parseISOString(p.end))})`;
      legend.appendChild(item);
    });
  }

  function render(animate) {
    const today    = new Date();
    const todayMid = midnight(today);

    const mainEvents = events.filter(e => !e.calOnly);
    const sorted   = [...mainEvents].sort((a, b) => parseISOString(a.date) - parseISOString(b.date));

    const upcoming = sorted.filter(e => {
      const diff = calendarDayDiff(parseISOString(e.date), todayMid);
      return diff >= 0 && !(e.type === 'Abgabe' && doneItems.includes(e.id));
    });
    renderHero(upcoming[0], todayMid);

    const tl = buildTimeline(todayMid, animate);
    document.getElementById('timeline-container').innerHTML = tl.html;
    if (animate) {
      const bar = document.getElementById('timeline-progress-bar');
      requestAnimationFrame(() => requestAnimationFrame(() => {
        if (bar) bar.style.width = tl.targetPct + '%';
      }));
    }

    const abgaben     = mainEvents.filter(e => e.type === 'Abgabe');
    const abgabenDone = abgaben.filter(e => doneItems.includes(e.id)).length;
    const next7       = sorted.filter(e => {
      const diff = calendarDayDiff(parseISOString(e.date), todayMid);
      return diff >= 0 && diff <= 7;
    }).length;

    document.getElementById('stats-line').innerHTML =
      `<b>${mainEvents.length}</b> Termine · <b>${abgabenDone}/${abgaben.length}</b> Abgaben erledigt · <b>${next7}</b> in &le; 7 Tagen`;

    const listEl = document.getElementById('list');
    listEl.innerHTML = '';

    // Filter-Logik für die Liste
    const visibleEvents = sorted.filter(item => {
      const d = parseISOString(item.date);
      const diffDays = calendarDayDiff(d, todayMid);

      // Wenn showPast false ist und das Datum in der Vergangenheit liegt, ausblenden
      if (!showPast && diffDays < 0) return false;

      return true;
    });

    if (visibleEvents.length === 0) {
      listEl.innerHTML = `<div class="empty-state">Keine Termine in dieser Ansicht.</div>`;
      return;
    }

    visibleEvents.forEach((item, idx) => {
      const d        = parseISOString(item.date);
      const diffDays = calendarDayDiff(d, todayMid);
      const diffWeeks = (diffDays / 7).toFixed(1).replace('.', ',');
      const isAbgabe = item.type === 'Abgabe';
      const isDone   = isAbgabe && doneItems.includes(item.id);

      let countdownClass = '', countdownContent = '';
      if (isDone) {
        countdownClass   = 'done-badge';
        countdownContent = `<span class="primary">Erledigt</span><span class="secondary">abgehakt</span>`;
      } else if (diffDays < 0) {
        countdownClass   = 'expired';
        countdownContent = `<span class="primary">Abgelaufen</span><span class="secondary">vor ${Math.abs(diffDays)} Tg.</span>`;
      } else if (diffDays === 0) {
        countdownClass   = 'urgent';
        countdownContent = `<span class="primary">Heute</span><span class="secondary">${escapeHtml(item.time)}</span>`;
      } else {
        if (diffDays <= 7) countdownClass = 'urgent';
        countdownContent = `<span class="primary">${diffDays} Tag${diffDays !== 1 ? 'e' : ''}</span><span class="secondary">${diffWeeks} Wo.</span>`;
      }

      const checkElement = isAbgabe
        ? `<label class="checkbox-wrapper"><input type="checkbox" onchange="toggleDone('${item.id}')" ${isDone ? 'checked' : ''} aria-label="${escapeHtml(item.title)} erledigt"></label>`
        : `<div class="checkbox-wrapper"><div class="dot-marker"></div></div>`;

      const card = document.createElement('div');
      card.className = `card glass glass-sheen ${isDone ? 'done' : ''} ${animate ? 'enter' : ''}`;
      card.id = `card-${item.id}`;
      if (animate) card.style.setProperty('--delay', (idx * 0.035) + 's');
      card.innerHTML = `
        <div class="card-inner">
          <div class="card-left">
            ${checkElement}
            <div class="info">
              <span class="badge ${typeClass(item.type)}">${item.type}</span>
              <div class="title">${escapeHtml(item.title)}</div>
              <div class="meta">${formatDate(d)} · ${escapeHtml(item.time)}</div>
            </div>
          </div>
          <div class="countdown ${countdownClass}">${countdownContent}</div>
        </div>
      `;
      listEl.appendChild(card);
    });

    if (calVisible) renderCalendar();
  }

  document.getElementById('cal-toggle-btn').addEventListener('click', toggleCalendar);
  document.getElementById('cal-prev').addEventListener('click', () => calNav(-1));
  document.getElementById('cal-next').addEventListener('click', () => calNav(+1));

  // NEU: Event Listener für den "Vergangene anzeigen" Button
  const togglePastBtn = document.getElementById('toggle-past-btn');
  togglePastBtn.addEventListener('click', () => {
    showPast = !showPast;
    togglePastBtn.textContent = showPast ? "Vergangene ausblenden" : "Vergangene anzeigen";
    togglePastBtn.classList.toggle('active', showPast);
    render(false);
  });

  (async function init() {
    buildLegendPeriods();
    await loadDoneItems();
    render(true);
    setInterval(() => render(false), 60000);
  })();
</script>
</body>
</html>
